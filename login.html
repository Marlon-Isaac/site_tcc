<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sapai login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/icon1.png">
</head>
<body id="login">
    <img src="img/seta.png" alt="voltar" class="back-button" onclick="window.location.href='index.html'">
    <div class="login-container">
        
        <h1>Login</h1>
        <form action="#" method="post">

            
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="login" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="senha_login" required>
            <button type="submit">Entrar</button>
            <button type="button" onclick="window.location.href='registro.html'">Registrar</button>
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Lembrar usuario?</label>

            
        </form>
        </div>
        <div class="resposta">
            <!-- Aqui será exibida a resposta do login -->
            </div>
        </div>
    
</body>
</html>
